spring.application.name=backendpetsalud
spring.config.import=optional:file:./config/petsalud-local.properties
server.address=${PETSALUD_SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=${PETSALUD_DB_URL:jdbc:mysql://localhost:3306/petsalud_db?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=${PETSALUD_DB_USER:petsalud_app}
spring.datasource.password=${PETSALUD_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${PETSALUD_DDL_AUTO:update}
spring.jpa.open-in-view=true

petsalud.jwt.secret=${PETSALUD_JWT_SECRET}
petsalud.jwt.minutes=${PETSALUD_JWT_MINUTES:15}
